
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Club Members</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #fff0f5;
            font-family: Arial, sans-serif;
        }

        .container-box {
            max-width: 550px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ffb6c1;
            border-radius: 12px;
        }

        h2 {
            color: #d65b8a;
            font-weight: bold;
        }

        label {
            color: #ad1457;
            font-weight: bold;
        }

        .form-control {
            border: 1px solid #ffb6c1;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #ff69b4;
            box-shadow: none;
            outline: none;
        }

        .btn-pink {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
        }

        .btn-pink:hover {
            background-color: #e75499;
            color: white;
        }

        .pink-box {
            background-color: #fff0f5;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            padding: 15px;
            color: #880e4f;
            line-height: 1.8;
        }

        hr {
            border-color: #ffb6c1;
        }
    </style>
</head>

<body>

    <div class="container container-box">

        <div class="text-center mb-4">
            <h2>⋆.𐙚 ̊Student Club𐙚🧸ྀི<h2>
            <p class="text-muted">Member Management System</p>
        </div>

        <hr>

        <div class="mb-3">
            <label for="first_name" class="form-label">
                First Name
            </label>

            <input type="text" id="first_name"
                   class="form-control"
                   placeholder="Enter first name">
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">
                Last Name
            </label>

            <input type="text" id="last_name"
                   class="form-control"
                   placeholder="Enter last name">
        </div>

        <button id="add_btn"
                type="button"
                py-click="add_member"
                class="btn btn-pink w-100">
            Add Member
        </button>

        <hr class="my-4">
        <h5 style="color: #ad1457;">ུ ❃۪ Club Members</h5>

        <div id="output">
            <p class="text-muted">Add a member to see the roster.</p>
        </div>

    </div>
    <script type="py" src="./main.py"></script>

</body>
</html>
